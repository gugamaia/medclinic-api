name: PR - Build, Test & Coverage

# Roda em toda pull request contra main: build do projeto, testes
# unitarios e verificacao do limite minimo de cobertura (RNF07). Esse
# workflow NAO publica imagem nem faz deploy - isso fica a cargo do
# deploy.yml, disparado so em push direto para main (apos o merge).
on:
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Lint (ESLint + Prettier)
        run: npm run lint:check

      - name: Build (nest build)
        run: npm run build

      - name: Rodar testes com cobertura
        run: npm run test:cov
